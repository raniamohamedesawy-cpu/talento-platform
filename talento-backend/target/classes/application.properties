server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/talento_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=talento-secret-key-min-32-characters-long
jwt.expiration=86400000

logging.level.com.talento=DEBUG
