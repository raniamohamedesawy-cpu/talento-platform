server:
  port: 8080
  error:
    include-message: always

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/talento?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:talento_user}
    password: ${DB_PASSWORD:SecureDB@2026!Talento#Prod}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  # ─── Redis Configuration (Token Revocation) ────────────────────────────────
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    timeout: 60000ms
    jedis:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms

  jpa:
    hibernate:
      ddl-auto: update          # use 'validate' in production
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# ─── JWT / CORS ───────────────────────────────────────────────────────────────
talento:
  jwt:
    secret: ${JWT_SECRET:talento-super-secret-key-change-in-production-min-256-bits}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

# ─── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    com.talento: DEBUG
    org.springframework.security: INFO
